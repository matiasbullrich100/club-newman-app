name: Actualizar resultados Fixt. Division

# Baja de URBA los resultados de TODOS los cruces de cada zona con Fixt. Division y los guarda en
# Firestore (resultadosDivision/{categoriaId}), pegandole a
# src/app/api/cron/actualizar-resultados-division/route.ts.
#
# Durante los partidos el Fixt. Division ya se refresca solo desde el cron de la tabla
# (actualizar-posiciones.yml, que ahora arrastra la division de la categoria que sumo fecha).
# Este workflow es el REPASO COMPLETO: hace varios fetches grandes a /championship/{id} de cada
# zona, asi que corre DESPUES de cada jornada (de noche, sin trafico en vivo) y los lunes, para
# levantar correcciones que URBA cargo tarde.
#
# Horarios en UTC (GitHub Actions no soporta zona horaria). Argentina es UTC-3 todo el año, asi
# que cada horario ART de abajo es UTC + 3. Cada corrida actualiza TODO (Superior + Juveniles).
on:
  schedule:
    - cron: "0 1 * * 0"        # 22:00 ART sabado -- despues de la fecha de Plantel Superior
    - cron: "0 1 * * 1"        # 22:00 ART domingo -- despues de la fecha de Juveniles
    - cron: "0 11,16,23 * * 1" # 08:00 / 13:00 / 20:00 ART lunes -- 3 repasos
  workflow_dispatch: # correr a mano desde GitHub, cualquier dia

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Pegarle al endpoint de actualizacion
        run: |
          curl --fail --silent --show-error --max-time 120 \
            "${{ vars.APP_URL }}/api/cron/actualizar-resultados-division" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
