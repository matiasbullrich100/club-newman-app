name: Actualizar tabla de posiciones

# Vercel Cron (plan Hobby/gratis) no permite correr mas de 1 vez por dia -- lo que pide este
# cronograma (por hora los sabados, por minuto en una ventana, por minuto/5-15 los domingos)
# necesita muchas mas corridas que eso, asi que se dispara desde GitHub Actions en su lugar,
# pegandole al mismo endpoint (src/app/api/cron/actualizar-posiciones/route.ts).
#
# Los horarios estan en UTC (GitHub Actions no soporta zona horaria en `schedule`). Argentina es
# UTC-3 todo el año (sin horario de verano), asi que cada horario ART de abajo es horario UTC + 3.
#
# GitHub avisa que los cron de Actions pueden demorarse unos minutos en momentos de mucha carga
# -- "cada minuto" es una frecuencia ambiciosa para su scheduler gratuito, puede saltear algun
# tick puntual, pero en la practica sigue actualizando muy seguido.
on:
  schedule:
    # --- Plantel Superior (juega sabado) ---
    - cron: "0 13-20 * * 6" # 10:00 a 17:00 ART, 1 vez por hora
    - cron: "15-59 20 * * 6" # 17:15 a 17:59 ART, 1 vez por minuto
    - cron: "0 21 * * 6" # 18:00 ART (cierre de la ventana de cada minuto)
    # --- Juveniles (juega domingo) ---
    - cron: "0,15,30,45 13-16 * * 0" # 10:00 a 13:45 ART, cada 15 minutos
    - cron: "*/5 17-22 * * 0" # 14:00 a 19:55 ART, cada 5 minutos
    - cron: "0 23 * * 0" # 20:00 ART (cierre de la ventana de cada 5 minutos)
  workflow_dispatch: # permite correrlo a mano desde GitHub para probar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar grupo segun el dia (sabado = superior, domingo = juveniles)
        id: grupo
        run: |
          dia=$(date -u +%u)
          if [ "$dia" = "6" ]; then
            echo "valor=superior" >> "$GITHUB_OUTPUT"
          elif [ "$dia" = "7" ]; then
            echo "valor=juveniles" >> "$GITHUB_OUTPUT"
          else
            echo "valor=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pegarle al endpoint de actualizacion
        if: steps.grupo.outputs.valor != ''
        run: |
          curl --fail --silent --show-error \
            "${{ vars.APP_URL }}/api/cron/actualizar-posiciones?grupo=${{ steps.grupo.outputs.valor }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
