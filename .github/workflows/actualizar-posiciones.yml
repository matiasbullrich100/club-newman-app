name: Actualizar tabla de posiciones

# El cronograma real vive aca (Vercel Cron en plan gratis no permite mas de 1 corrida por dia).
# Le pega al endpoint src/app/api/cron/actualizar-posiciones/route.ts. Ese endpoint, ademas de
# la tabla, refresca el Fixt. Division de las categorias que sumaron una fecha nueva -- asi tabla
# y Fixt. Division nunca quedan desfasados.
#
# Horarios en UTC (GitHub Actions no soporta zona horaria en `schedule`). Argentina es UTC-3
# todo el año (sin horario de verano):  ART = UTC - 3   <=>   UTC = ART + 3.
#
# Cronograma pedido por el club:
#   * Plantel Superior (sabado):  14:00-17:00 ART cada 20 min ;  17:00-21:00 ART cada 10 min
#   * Juveniles (domingo):        13:00-21:30 ART cada 20 min
#   * Lunes: 3 repasos que actualizan TODO (Superior + Juveniles)
#
# OJO: el scheduler gratuito de GitHub Actions puede atrasar o saltear algun tick cuando hay
# mucha carga -- "cada 10/20 min" en la practica es "aproximadamente cada 10/20 min".
on:
  schedule:
    # --- Plantel Superior (sabado ART) ---
    - cron: "0,20,40 17-19 * * 6"  # 14:00 a 16:40 ART, cada 20 min
    - cron: "*/10 20-23 * * 6"     # 17:00 a 20:50 ART, cada 10 min
    - cron: "0 0 * * 0"            # 21:00 ART sabado -- cierra la ventana (es domingo 00:00 UTC)
    # --- Juveniles (domingo ART) ---
    - cron: "0,20,40 16-23 * * 0"  # 13:00 a 20:40 ART, cada 20 min
    - cron: "0,20,30 0 * * 1"      # 21:00 / 21:20 / 21:30 ART domingo -- cierra (es lunes 00:xx UTC)
    # --- Lunes de repaso (actualiza todo) ---
    - cron: "0 11,16,23 * * 1"     # 08:00 / 13:00 / 20:00 ART lunes
  workflow_dispatch: # correr a mano desde GitHub para probar, cualquier dia
    inputs:
      grupo:
        description: "Que actualizar (auto = decide por dia/hora, igual que el cron programado)"
        type: choice
        options: [auto, superior, juveniles, todo]
        default: auto

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Decidir que actualizar segun dia y hora UTC
        id: grupo
        run: |
          entrada="${{ github.event.inputs.grupo }}"
          if [ -n "$entrada" ] && [ "$entrada" != "auto" ]; then
            echo "valor=$entrada" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dia=$(date -u +%u)   # 1=lunes .. 7=domingo
          hora=$(date -u +%H)  # 00..23
          if [ "$dia" = "6" ]; then
            valor=superior                    # sabado UTC = ventana Plantel Superior
          elif [ "$dia" = "7" ] && [ "$hora" = "00" ]; then
            valor=superior                    # domingo 00:xx UTC = sabado 21:xx ART (cierre Plantel)
          elif [ "$dia" = "7" ]; then
            valor=juveniles                   # domingo UTC = ventana Juveniles
          elif [ "$dia" = "1" ] && [ "$hora" = "00" ]; then
            valor=juveniles                   # lunes 00:xx UTC = domingo 21:xx ART (cierre Juveniles)
          elif [ "$dia" = "1" ]; then
            valor=todo                        # lunes de dia = repaso completo
          else
            valor=skip
          fi
          echo "valor=$valor" >> "$GITHUB_OUTPUT"

      - name: Pegarle al endpoint de actualizacion
        if: steps.grupo.outputs.valor != 'skip'
        run: |
          valor="${{ steps.grupo.outputs.valor }}"
          qs=""
          if [ "$valor" != "todo" ]; then qs="?grupo=$valor"; fi
          curl --fail --silent --show-error --max-time 90 \
            "${{ vars.APP_URL }}/api/cron/actualizar-posiciones$qs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
